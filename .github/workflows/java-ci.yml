name: Java CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout repository
          uses: actions/checkout@v6
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
        - name: Run mvn clean test
          run: mvn clean test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
        - name: Checkout repository
          uses: actions/checkout@v6
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
        - name: Build
          run: mvn clean package -DskipTests
        - name: Upload JAR
          uses: actions/upload-artifact@v4
          with:
            name: ProductInventory
            path: target/product-inventory-1.0-SNAPSHOT.jar


